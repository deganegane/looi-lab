name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (release, signed with the shared key)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log

      # Compile errors as annotations, readable without opening the raw log.
      - name: Surface compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LOOI-Lab.apk

      - name: Publish release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LOOI Lab – build ${{ github.run_number }}
          files: LOOI-Lab.apk
